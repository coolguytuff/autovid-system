name: Daily AutoVid Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install ffmpeg -y

      - name: Run AutoVid Engine
        run: |
          python app.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autovid-output
          path: output/
